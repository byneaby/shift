# Свои server_name обязательны. Иначе порт 80 default_server
# отдаёт чужой сайт (корень eron.kz) на эти имена.
# Файлы: /opt/shiftclub/server/wwwroot/product и .../guide
# DNS: product.shift-club.kz и wiki.shift-club.kz → A 195.49.210.17

server {
    server_name product.shift-club.kz www.product.shift-club.kz;
    client_max_body_size 1m;

    root /opt/shiftclub/server/wwwroot/product;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/product.shift-club.kz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/product.shift-club.kz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    server_name wiki.shift-club.kz www.wiki.shift-club.kz;
    client_max_body_size 1m;

    root /opt/shiftclub/server/wwwroot/guide;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/wiki.shift-club.kz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/wiki.shift-club.kz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = product.shift-club.kz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name product.shift-club.kz www.product.shift-club.kz;
    return 404; # managed by Certbot


}

server {
    if ($host = wiki.shift-club.kz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name wiki.shift-club.kz www.wiki.shift-club.kz;
    return 404; # managed by Certbot


}