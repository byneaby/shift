# Лендинг и вики. Тот же адрес, что у центра лицензий.
# На ps.kz добавьте A-записи (сам сервер их не создаёт):
#   product.shift-club.kz   A   195.49.210.17
#   wiki.shift-club.kz      A   195.49.210.17
#
# Файлы появляются в каталоге лицензий после выкладки:
#   /opt/shiftclub/license/wwwroot/product
#   /opt/shiftclub/license/wwwroot/guide
# Проверка и применение: nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name product.shift-club.kz www.product.shift-club.kz;
    client_max_body_size 1m;

    root /opt/shiftclub/license/wwwroot/product;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name wiki.shift-club.kz www.wiki.shift-club.kz;
    client_max_body_size 1m;

    root /opt/shiftclub/license/wwwroot/guide;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
