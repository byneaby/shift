# Центр лицензий. Не default_server: на этом IP живут другие сайты.
# DNS: licence.shift-club.kz и license.shift-club.kz → A 195.49.210.17
# client_max_body_size 2048m — загрузка установщиков сервера и клиента из админки.
server {
    server_name licence.shift-club.kz license.shift-club.kz;
    client_max_body_size 2048m;

    location / {
        proxy_pass http://127.0.0.1:5081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/licence.shift-club.kz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/licence.shift-club.kz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = licence.shift-club.kz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name licence.shift-club.kz license.shift-club.kz;
    return 404; # managed by Certbot


}
