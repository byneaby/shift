# Центр лицензий. Не default_server: на этом IP живут другие сайты.
# DNS: licence.shift-club.kz и license.shift-club.kz → A 195.49.210.17
server {
    listen 80;
    listen [::]:80;
    server_name licence.shift-club.kz license.shift-club.kz;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:5081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
