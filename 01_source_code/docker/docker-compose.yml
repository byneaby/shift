services:
  postgres:
    image: postgres:16-alpine
    container_name: shiftclub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shiftclub
      POSTGRES_USER: shiftclub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shiftclub_dev}
    ports:
      - "5432:5432"
    volumes:
      - shiftclub_pgdata:/var/lib/postgresql/data

volumes:
  shiftclub_pgdata:
