<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>SHIFT — сканер QR</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0b0c;
      --text: #f4f4f5;
      --muted: #8b8b90;
      --accent: #ff6a00;
      --card: #16161a;
      --ok: #3ddc97;
      --err: #ff8a8a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(800px 400px at 20% -10%, #ff6a0033, transparent 55%), var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid #ffffff14;
      border-radius: 18px;
      padding: 28px 24px;
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: 1.35rem; font-weight: 700; letter-spacing: 0.02em; }
    p { margin: 0 0 18px; color: var(--muted); line-height: 1.45; font-size: 0.95rem; }
    button {
      appearance: none;
      border: 0;
      border-radius: 12px;
      padding: 14px 18px;
      width: 100%;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #ff8a2b, var(--accent));
      color: #fff;
    }
    button.ghost {
      margin-top: 10px;
      background: transparent;
      border: 1px solid #ffffff22;
      color: var(--text);
    }
    button:disabled { opacity: 0.55; cursor: default; }
    .status { margin-top: 16px; font-size: 0.9rem; min-height: 1.4em; white-space: pre-line; }
    .ok { color: var(--ok); }
    .err { color: var(--err); }
    .brand { font-size: 0.75rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
    label { display: block; text-align: left; font-size: 0.85rem; color: var(--muted); margin: 8px 0 4px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #ffffff22;
      background: #0f0f12;
      color: var(--text);
      font-size: 1rem;
    }
    .check { display: flex; gap: 8px; align-items: center; text-align: left; margin: 10px 0; color: var(--muted); font-size: 0.9rem; }
    .form { text-align: left; margin-top: 8px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card" id="scanCard">
    <div class="brand">SHIFT Club</div>
    <h1>Сканирование QR</h1>
    <p>Наведите камеру на QR на экране ПК — вход, регистрация или привязка Telegram.</p>
    <button id="scanBtn" type="button">Открыть сканер</button>
    <button id="closeBtn" class="ghost" type="button">Закрыть</button>
    <div id="status" class="status"></div>
  </div>

  <div class="card hidden" id="regCard">
    <div class="brand">SHIFT Club</div>
    <h1>Аккаунт для ПК</h1>
    <p id="regLead">Telegram подтверждён. Заполните данные — вход на ПК будет автоматическим.</p>
    <div class="form">
      <label>Имя</label><input id="regFirst" autocomplete="given-name" />
      <label>Фамилия</label><input id="regLast" autocomplete="family-name" />
      <label>Телефон</label><input id="regPhone" inputmode="tel" placeholder="77001234567" autocomplete="tel" />
      <label>Пароль (мин. 4)</label><input id="regPass" type="password" autocomplete="new-password" />
      <label class="check"><input type="checkbox" id="regLink" /> Уже есть аккаунт — привязать этот Telegram</label>
    </div>
    <div id="regStatus" class="status"></div>
    <button id="regSubmit" type="button">Создать и войти на ПК</button>
    <button id="regPc" class="ghost" type="button">Заполню на ПК</button>
    <button id="regBack" class="ghost" type="button">Назад к сканеру</button>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.setHeaderColor('#0b0b0c'); } catch (_) {}
      try { tg.setBackgroundColor('#0b0b0c'); } catch (_) {}
    }

    const statusEl = document.getElementById('status');
    const scanBtn = document.getElementById('scanBtn');
    const closeBtn = document.getElementById('closeBtn');
    let pendingTicketCode = null;

    function setStatus(el, text, ok) {
      el.textContent = text || '';
      el.className = 'status ' + (ok === true ? 'ok' : ok === false ? 'err' : '');
    }

    function readInitData() {
      const fromApi = (tg && tg.initData) || '';
      if (fromApi) return fromApi;
      try {
        const hash = (location.hash || '').replace(/^#/, '');
        const p = new URLSearchParams(hash);
        const raw = p.get('tgWebAppData');
        if (raw) return decodeURIComponent(raw);
      } catch (_) {}
      return '';
    }

    function showScan() {
      document.getElementById('regCard').classList.add('hidden');
      document.getElementById('scanCard').classList.remove('hidden');
      pendingTicketCode = null;
    }

    async function confirmViaApi(raw) {
      const initData = readInitData();
      const res = await fetch('/api/tg/qr/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData: initData || null, qrPayload: raw })
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok || json.success === false) {
        throw new Error(json.message || ('Ошибка ' + res.status));
      }
      return json.data;
    }

    function syncRegCta() {
      document.getElementById('regSubmit').textContent =
        document.getElementById('regLink').checked ? 'Привязать и войти на ПК' : 'Создать и войти на ПК';
    }

    function showRegister(data) {
      if (!data || !data.ticketCode) {
        setStatus(statusEl, 'QR подтверждён, но код потерян. Отсканируйте снова.', false);
        return;
      }
      pendingTicketCode = data.ticketCode;
      document.getElementById('scanCard').classList.add('hidden');
      document.getElementById('regCard').classList.remove('hidden');
      document.getElementById('regLead').textContent = data.message || 'Заполните данные для входа на ПК.';
      setStatus(document.getElementById('regStatus'), '', null);
      const auth = data.auth || {};
      const parts = String(auth.fullName || '').trim().split(/\s+/);
      document.getElementById('regFirst').value = parts[0] || '';
      document.getElementById('regLast').value = parts.length > 1 ? parts.slice(1).join(' ') : '';
      syncRegCta();
    }

    async function handleScan(raw) {
      if (!raw) {
        setStatus(statusEl, 'Сканирование отменено');
        return;
      }
      setStatus(statusEl, 'Подтверждаем…');
      try {
        const data = await confirmViaApi(raw);
        if (data && data.needsRegistration) {
          showRegister(data);
          return;
        }
        setStatus(statusEl, (data && data.message) || 'Готово. Вернитесь к ПК — вход уже идёт.', true);
      } catch (apiErr) {
        setStatus(statusEl, apiErr.message || 'Не удалось подтвердить QR', false);
      }
    }

    function openScanner() {
      if (!tg || typeof tg.showScanQrPopup !== 'function') {
        setStatus(statusEl, 'Сканер недоступен в этой версии Telegram. Обновите приложение.', false);
        return;
      }
      setStatus(statusEl, 'Сканер открыт…');
      tg.showScanQrPopup({ text: 'QR с экрана ПК' }, function (text) {
        if (text) {
          try { tg.closeScanQrPopup(); } catch (_) {}
          handleScan(text);
        } else {
          setStatus(statusEl, 'Сканирование отменено');
        }
      });
    }

    document.getElementById('regLink').addEventListener('change', syncRegCta);

    document.getElementById('regPc').addEventListener('click', () => {
      setStatus(document.getElementById('regStatus'), 'Вернитесь к ПК — справа откроется форма. После сохранения вход будет автоматическим.', true);
    });

    document.getElementById('regBack').addEventListener('click', () => {
      showScan();
      setStatus(statusEl, '');
    });

    document.getElementById('regSubmit').addEventListener('click', async () => {
      const st = document.getElementById('regStatus');
      const btn = document.getElementById('regSubmit');
      const phone = (document.getElementById('regPhone').value || '').replace(/\D/g, '');
      if (!pendingTicketCode) {
        setStatus(st, 'Нет кода QR. Отсканируйте снова.', false);
        return;
      }
      if (phone.length < 10) {
        setStatus(st, 'Укажите телефон — не менее 10 цифр.', false);
        return;
      }
      if ((document.getElementById('regPass').value || '').trim().length < 4) {
        setStatus(st, 'Пароль: минимум 4 символа.', false);
        return;
      }
      btn.disabled = true;
      setStatus(st, 'Сохраняем…');
      try {
        const res = await fetch('/api/tg/qr/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData: readInitData() || null,
            ticketCode: pendingTicketCode,
            firstName: document.getElementById('regFirst').value,
            lastName: document.getElementById('regLast').value,
            phone: document.getElementById('regPhone').value,
            password: document.getElementById('regPass').value,
            linkExisting: document.getElementById('regLink').checked
          })
        });
        const json = await res.json().catch(() => ({}));
        if (!res.ok || json.success === false) throw new Error(json.message || ('Ошибка ' + res.status));
        setStatus(st, (json.data && json.data.message) || 'Готово. Вернитесь к ПК — вход уже идёт.', true);
      } catch (e) {
        btn.disabled = false;
        setStatus(st, e.message || 'Ошибка', false);
      }
    });

    scanBtn.addEventListener('click', openScanner);
    closeBtn.addEventListener('click', () => { try { tg && tg.close(); } catch (_) {} });
    setTimeout(openScanner, 250);
  </script>
</body>
</html>
