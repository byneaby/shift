<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Вызов администратора · SHIFT</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;
      --bg0: #07090d;
      --bg1: #101820;
      --text: #f4f7fb;
      --muted: #9aa8b8;
      --accent: #ff6a00;
      --accent-deep: #d45500;
      --ok: #3ddc97;
      --err: #ff7a7a;
      --ring: rgba(255, 106, 0, 0.45);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      height: 100%;
    }
    body {
      font-family: Manrope, system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(1100px 520px at 50% -20%, rgba(255, 106, 0, 0.22), transparent 58%),
        radial-gradient(800px 420px at 90% 110%, rgba(56, 189, 248, 0.08), transparent 50%),
        linear-gradient(180deg, var(--bg1), var(--bg0));
      display: grid;
      place-items: center;
      padding: clamp(16px, 3vw, 36px);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .shell {
      width: min(920px, 100%);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(18px, 3vh, 36px);
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .brand__mark {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background:
        linear-gradient(145deg, #ff8a2b, var(--accent) 45%, #b84300);
      box-shadow: 0 10px 30px rgba(255, 106, 0, 0.35);
      position: relative;
    }
    .brand__mark::after {
      content: "";
      position: absolute;
      inset: 14px 12px 14px 18px;
      border-left: 4px solid #fff;
      border-bottom: 4px solid #fff;
      transform: skewX(-12deg);
      opacity: 0.95;
    }
    .brand__name {
      margin: 0;
      font-family: Oswald, sans-serif;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      letter-spacing: 0.12em;
      font-weight: 700;
    }
    .brand__sub {
      margin: 0;
      color: var(--muted);
      font-size: clamp(0.95rem, 2vw, 1.1rem);
      font-weight: 600;
    }

    .howto {
      max-width: 34rem;
      margin: 0;
      padding: 14px 18px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(10, 14, 20, 0.55);
      color: var(--muted);
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      line-height: 1.45;
      font-weight: 600;
    }
    .howto strong {
      color: var(--text);
      font-weight: 700;
    }

    .call-btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      width: min(640px, 92vw);
      min-height: clamp(220px, 38vh, 340px);
      border-radius: 36px;
      padding: clamp(28px, 5vh, 48px) 28px;
      color: #fff;
      background:
        linear-gradient(165deg, #ff8f33 0%, var(--accent) 42%, var(--accent-deep) 100%);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.12) inset,
        0 18px 50px rgba(255, 106, 0, 0.42),
        0 0 0 10px rgba(255, 106, 0, 0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .call-btn:hover:not(:disabled) {
      filter: brightness(1.05);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.16) inset,
        0 22px 60px rgba(255, 106, 0, 0.5),
        0 0 0 14px rgba(255, 106, 0, 0.1);
    }
    .call-btn:active:not(:disabled) {
      transform: scale(0.985);
    }
    .call-btn:focus-visible {
      outline: 3px solid var(--ring);
      outline-offset: 6px;
    }
    .call-btn:disabled {
      cursor: wait;
      filter: saturate(0.85) brightness(0.92);
    }
    .call-btn.is-ok {
      background: linear-gradient(165deg, #4ae8a8, #1fbf7a 55%, #128a56);
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.12) inset,
        0 18px 50px rgba(61, 220, 151, 0.35);
    }
    .call-btn.is-err {
      background: linear-gradient(165deg, #ff9a9a, #e85a5a 55%, #b83434);
    }

    .call-btn__kicker {
      margin: 0;
      font-size: clamp(0.95rem, 2vw, 1.15rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.9;
    }
    .call-btn__title {
      margin: 0;
      font-family: Oswald, sans-serif;
      font-size: clamp(2.4rem, 8vw, 4.4rem);
      line-height: 1;
      letter-spacing: 0.04em;
      font-weight: 700;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
    }
    .call-btn__hint {
      margin: 6px 0 0;
      max-width: 22ch;
      font-size: clamp(1rem, 2.4vw, 1.25rem);
      font-weight: 600;
      opacity: 0.95;
      line-height: 1.35;
    }

    .status {
      min-height: 1.4em;
      margin: 0;
      font-size: clamp(1rem, 2vw, 1.15rem);
      font-weight: 600;
      color: var(--muted);
    }
    .status.is-ok { color: var(--ok); }
    .status.is-err { color: var(--err); }

    .foot {
      margin: 0;
      color: color-mix(in srgb, var(--muted) 80%, transparent);
      font-size: 0.9rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="brand">
      <div class="brand__mark" aria-hidden="true"></div>
      <p class="brand__name">SHIFT</p>
      <p class="brand__sub">Вызов администратора у кассы</p>
    </header>

    <p class="howto">
      У стойки лежит <strong>мышка</strong>. Наведите курсор на оранжевую кнопку и
      <strong>нажмите левой кнопкой</strong> — администратор получит вызов.
    </p>

    <button
      type="button"
      class="call-btn"
      id="callBtn"
      aria-label="Вызвать администратора"
    >
      <p class="call-btn__kicker" id="btnKicker">Нужна помощь?</p>
      <p class="call-btn__title" id="btnTitle">ВЫЗВАТЬ</p>
      <p class="call-btn__hint" id="btnHint">Нажмите мышкой — вызов уйдёт администратору</p>
    </button>

    <p class="status" id="status" aria-live="polite"></p>
    <p class="foot">Повторный вызов через ~10 сек. после предыдущего</p>
  </main>

  <script>
    (() => {
      const btn = document.getElementById('callBtn')
      const status = document.getElementById('status')
      const kicker = document.getElementById('btnKicker')
      const title = document.getElementById('btnTitle')
      const hint = document.getElementById('btnHint')

      let busy = false
      let cooldownUntil = 0
      let tickTimer = null

      function setIdle() {
        btn.classList.remove('is-ok', 'is-err')
        kicker.textContent = 'Нужна помощь?'
        title.textContent = 'ВЫЗВАТЬ'
        hint.textContent = 'Нажмите мышкой — вызов уйдёт администратору'
        status.className = 'status'
        status.textContent = ''
      }

      function setCooldown(seconds) {
        cooldownUntil = Date.now() + seconds * 1000
        btn.disabled = true
        if (tickTimer) clearInterval(tickTimer)
        const paint = () => {
          const left = Math.max(0, Math.ceil((cooldownUntil - Date.now()) / 1000))
          if (left <= 0) {
            clearInterval(tickTimer)
            tickTimer = null
            busy = false
            btn.disabled = false
            setIdle()
            return
          }
          hint.textContent = `Можно снова через ${left} сек.`
        }
        paint()
        tickTimer = setInterval(paint, 250)
      }

      async function callAdmin() {
        if (busy || Date.now() < cooldownUntil) return
        busy = true
        btn.disabled = true
        btn.classList.remove('is-ok', 'is-err')
        kicker.textContent = 'Отправляем…'
        title.textContent = 'ВЫЗОВ'
        hint.textContent = 'Секунду, пишем администратору'
        status.className = 'status'
        status.textContent = ''

        try {
          const res = await fetch('/api/public/call-admin', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
            body: JSON.stringify({ message: 'Гость у стойки зовёт администратора' }),
          })
          const json = await res.json().catch(() => ({}))
          if (!res.ok) {
            const msg = json?.message || json?.error || 'Не удалось отправить вызов'
            throw new Error(msg)
          }

          btn.classList.add('is-ok')
          kicker.textContent = 'Готово'
          title.textContent = 'ВЫЗВАЛИ'
          hint.textContent = 'Администратор уже получил сигнал. Подождите у стойки.'
          status.className = 'status is-ok'
          status.textContent = 'Вызов отправлен'
          const cool = Number(json?.data?.cooldownSeconds) || 10
          setCooldown(cool)
        } catch (e) {
          busy = false
          btn.disabled = false
          btn.classList.add('is-err')
          kicker.textContent = 'Не вышло'
          title.textContent = 'ЕЩЁ РАЗ'
          hint.textContent = 'Нажмите снова или позовите администратора устно'
          status.className = 'status is-err'
          status.textContent = e instanceof Error ? e.message : 'Ошибка сети'
        }
      }

      btn.addEventListener('click', () => void callAdmin())

      // Keep the page awake-ish for kiosk: prevent accidental text selection / context menu
      document.addEventListener('contextmenu', (e) => e.preventDefault())
    })()
  </script>
</body>
</html>
